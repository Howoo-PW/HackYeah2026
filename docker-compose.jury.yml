# docker compose --env-file .env -f docker-compose.jury.yml up --build --wait --wait-timeout 180
name: rate-my-road-jury

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai:
    build: ./ai-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Uzupelnij INTERNAL_API_KEY w .env}
      MOCK_AI: "false"
      AI_PROVIDER: ${AI_PROVIDER:-google_genai}
      AI_MODEL: ${AI_MODEL:?Uzupelnij AI_MODEL w .env}
      AI_API_KEY: ${AI_API_KEY:?Uzupelnij AI_API_KEY w .env}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_STRUCTURED_METHOD: ${AI_STRUCTURED_METHOD:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-12}
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert d['status']=='ok' and d['mock'] is False"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SUPABASE_URL: ${SUPABASE_URL:?Uzupelnij SUPABASE_URL w .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Uzupelnij SUPABASE_ANON_KEY w .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Uzupelnij SUPABASE_SERVICE_ROLE_KEY w .env}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Uzupelnij SUPABASE_DB_URL w .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Uzupelnij INTERNAL_API_KEY w .env}
      AI_SERVICE_URL: http://ai:8000
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SUMMARY_USE_RATINGS: ${SUMMARY_USE_RATINGS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/health')); assert d['status']=='ok'"]
      interval: 10s
      timeout: 15s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: jury/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:?Uzupelnij SUPABASE_URL w .env}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:?Uzupelnij SUPABASE_ANON_KEY w .env}}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
